<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 490" width="960" height="490" font-family="Segoe UI, Helvetica Neue, Arial, sans-serif">
<defs><marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#1b2430"/></marker><marker id="r" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#b91c1c"/></marker><marker id="g" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#0f5c4c"/></marker></defs>
<rect width="960" height="490" fill="#ffffff"/>
<text x="480" y="28" font-size="17" font-weight="bold" fill="#1b2430" text-anchor="middle">System context: who and what Kendali talks to</text>
<rect x="355" y="190" width="250" height="120" rx="8" fill="#e3f0ec" stroke="#0f5c4c" stroke-width="2"/>
<text x="480.0" y="212" font-size="14" font-weight="bold" fill="#0f5c4c" text-anchor="middle">Kendali agent + vault</text>
<text x="480.0" y="232" font-size="12" font-weight="normal" fill="#1b2430" text-anchor="middle">reads documents and chat,</text>
<text x="480.0" y="249" font-size="12" font-weight="normal" fill="#1b2430" text-anchor="middle">decides with a fixed policy,</text>
<text x="480.0" y="266" font-size="12" font-weight="normal" fill="#1b2430" text-anchor="middle">pays through KendaliVault</text>
<rect x="30" y="60" width="220" height="80" rx="8" fill="#fdf3e1" stroke="#9a5b0b" stroke-width="2"/>
<text x="140.0" y="82" font-size="14" font-weight="bold" fill="#9a5b0b" text-anchor="middle">Business owner (treasurer)</text>
<text x="140.0" y="102" font-size="12" font-weight="normal" fill="#1b2430" text-anchor="middle">chat EN/ID · owner console</text>
<text x="140.0" y="119" font-size="12" font-weight="normal" fill="#1b2430" text-anchor="middle">holds the OWNER key</text>
<rect x="30" y="210" width="220" height="80" rx="8" fill="#f1f5f9" stroke="#475569" stroke-width="2"/>
<text x="140.0" y="232" font-size="14" font-weight="bold" fill="#475569" text-anchor="middle">Suppliers</text>
<text x="140.0" y="252" font-size="12" font-weight="normal" fill="#1b2430" text-anchor="middle">send invoices (txt / PDF / JSON)</text>
<text x="140.0" y="269" font-size="12" font-weight="normal" fill="#1b2430" text-anchor="middle">receive tUSDC at KYB wallet</text>
<rect x="30" y="360" width="220" height="80" rx="8" fill="#fdecec" stroke="#b91c1c" stroke-width="2"/>
<text x="140.0" y="382" font-size="14" font-weight="bold" fill="#b91c1c" text-anchor="middle">Fraudster / attacker</text>
<text x="140.0" y="402" font-size="12" font-weight="normal" fill="#1b2430" text-anchor="middle">forged invoices, injection,</text>
<text x="140.0" y="419" font-size="12" font-weight="normal" fill="#1b2430" text-anchor="middle">stolen agent key</text>
<rect x="710" y="60" width="220" height="80" rx="8" fill="#f1f5f9" stroke="#475569" stroke-width="2"/>
<text x="820.0" y="82" font-size="14" font-weight="bold" fill="#475569" text-anchor="middle">LLM endpoint (optional)</text>
<text x="820.0" y="102" font-size="12" font-weight="normal" fill="#1b2430" text-anchor="middle">any OpenAI-compatible API</text>
<text x="820.0" y="119" font-size="12" font-weight="normal" fill="#1b2430" text-anchor="middle">JSON only, no keys, no tools</text>
<rect x="710" y="210" width="220" height="80" rx="8" fill="#f1f5f9" stroke="#475569" stroke-width="2"/>
<text x="820.0" y="232" font-size="14" font-weight="bold" fill="#475569" text-anchor="middle">EVM chain</text>
<text x="820.0" y="252" font-size="12" font-weight="normal" fill="#1b2430" text-anchor="middle">anvil devnet · Sepolia</text>
<text x="820.0" y="269" font-size="12" font-weight="normal" fill="#1b2430" text-anchor="middle">(production: permissioned EVM)</text>
<rect x="710" y="360" width="220" height="80" rx="8" fill="#f1f5f9" stroke="#475569" stroke-width="2"/>
<text x="820.0" y="382" font-size="14" font-weight="bold" fill="#475569" text-anchor="middle">Reference data</text>
<text x="820.0" y="402" font-size="12" font-weight="normal" fill="#1b2430" text-anchor="middle">vendor master (KYB) · open POs</text>
<text x="820.0" y="419" font-size="12" font-weight="normal" fill="#1b2430" text-anchor="middle">screening list · obligations</text>
<line x1="250" y1="100" x2="355" y2="210" stroke="#1b2430" stroke-width="1.8" marker-end="url(#a)"/>
<text x="305" y="140" font-size="11.5" font-weight="normal" fill="#5b6675" text-anchor="middle" stroke="#ffffff" stroke-width="5" stroke-linejoin="round" paint-order="stroke">instructions, approvals</text>
<line x1="250" y1="250" x2="355" y2="250" stroke="#1b2430" stroke-width="1.8" marker-end="url(#a)"/>
<text x="302" y="243" font-size="11.5" font-weight="normal" fill="#5b6675" text-anchor="middle" stroke="#ffffff" stroke-width="5" stroke-linejoin="round" paint-order="stroke">invoices</text>
<line x1="250" y1="400" x2="355" y2="290" stroke="#b91c1c" stroke-width="1.8" marker-end="url(#r)"/>
<text x="300" y="372" font-size="11.5" font-weight="normal" fill="#b91c1c" text-anchor="middle" stroke="#ffffff" stroke-width="5" stroke-linejoin="round" paint-order="stroke">hostile input</text>
<line x1="605" y1="215" x2="710" y2="110" stroke="#1b2430" stroke-width="1.8" marker-end="url(#a)"/>
<text x="660" y="150" font-size="11.5" font-weight="normal" fill="#5b6675" text-anchor="middle" stroke="#ffffff" stroke-width="5" stroke-linejoin="round" paint-order="stroke">untrusted text → JSON</text>
<line x1="605" y1="250" x2="710" y2="250" stroke="#1b2430" stroke-width="1.8" marker-end="url(#a)"/>
<text x="657" y="243" font-size="11.5" font-weight="normal" fill="#5b6675" text-anchor="middle" stroke="#ffffff" stroke-width="5" stroke-linejoin="round" paint-order="stroke">signed tx, eth_call</text>
<line x1="710" y1="400" x2="605" y2="290" stroke="#1b2430" stroke-width="1.8" marker-end="url(#a)"/>
<text x="665" y="372" font-size="11.5" font-weight="normal" fill="#5b6675" text-anchor="middle" stroke="#ffffff" stroke-width="5" stroke-linejoin="round" paint-order="stroke">read-only</text>
<text x="480" y="470" font-size="12" font-weight="normal" fill="#5b6675" text-anchor="middle">Trust boundary: everything entering Kendali from the left and the LLM&#x27;s output is treated as data, never as a command.</text>
</svg>
